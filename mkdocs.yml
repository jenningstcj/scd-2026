site_name: Strategic Claims Direction LLC
site_description: >-
  Strategic Claims Direction LLC is a claims and insurance consulting firm
  based on the premise that our clients can directly impact their claims
  costs through development and implementation of effective and efficient
  claims management strategies.
site_url: https://strategicclaimsdirection.com/
copyright: Copyright &copy; 2026 Tyler Jennings

theme:
  name: material
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - About: about.md
  - Services: services.md
  - Claims Audits: claims-audits.md
  - Publications: publications.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/pub/gary-jennings/1/428/346
